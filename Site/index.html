<!doctype html>
<html lang=en>
    <head>
        <meta charset=utf-8>
        <meta name=viewport content='width=device-width, initial-scale=1' />
        <meta name=color-scheme content='light dark' />
        <link rel="stylesheet" href="styles/pico.sand.css">
        <link rel=stylesheet href=styles/main.css />

        <!-- hydrate.js can't be discovered by the parser until it runs, so start
             its first-wave fetches now instead of one round trip later. these
             only get consumed while hydrate.js fetches at the default cache
             mode — a cache: 'reload'/'no-cache' there would discard them -->
        <link rel=modulepreload href=/hydrate.js>
        <link rel=preload as=fetch href=/lib/index-provider.js crossorigin>
        <link rel=preload as=fetch href=/lib/redirect-provider.js crossorigin>
        <link rel=preload as=fetch href=/scripts/rule.js crossorigin>
        <link rel=preload as=fetch href=/ui/nav.htm crossorigin>

        <script type=module src=hydrate.js defer></script>
        <title>RUMblog</title>

    </head>
    <body>
        <div blocker></div>

        <call lib.index-provider></call>
        <call lib.redirect-provider></call>

        <call scripts.rule target=RUMBLE>
            <strong style='color: rgb(182, 155, 107);'><em>
                <argument target></argument>
            </em></strong>
        </call>

        <call scripts.rule target=[Vv]olatile>
            <em style='color: rgb(238, 118, 118);'>
                <argument target></argument>
            </em>
        </call>

        <call scripts.rule target=[Ff]low>
            <em style='color: rgb(78, 200, 200);'>
                <argument target></argument>
            </em>
        </call>

        <call scripts.rule target=[Cc]harge>
            <em style='color: rgb(230, 200, 105);'>
                <argument target></argument>
            </em>
        </call>

        <call scripts.rule target=[Ss]tubborn>
            <em style='color: rgb(100, 150, 220);'>
                <argument target></argument>
            </em>
        </call>

        <call scripts.rule target=[Gg]uard>
            <em style='color: rgb(225, 160, 110);'>
                <argument target></argument>
            </em>
        </call>

        <call scripts.rule target=[Aa]damant>
            <em style='color: rgb(205, 120, 220);'>
                <argument target></argument>
            </em>
        </call>

        <call scripts.rule target=[Ss]urge>
            <em style='color: rgb(120, 210, 100);'>
                <argument target></argument>
            </em>
        </call>

        <call scripts.rule target=[Vv]igor>
            <em style='color: rgb(190, 205, 120);'>
                <argument target></argument>
            </em>
        </call>

        <header>
            <page ui.nav />
        </header>

        <main class=container-fluid>
            <call scripts.init-home />
        </main>

        <footer>
            <page ui.links />
        </footer>
    </body>
</html>
