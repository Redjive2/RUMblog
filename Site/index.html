<!doctype html>
<html lang=en>
    <head>
        <meta charset=utf-8>
        <meta name=viewport content='width=device-width, initial-scale=1' />
        <meta name=color-scheme content='light dark' />
        <link rel="stylesheet" href="styles/pico.sand.css">
        <link rel=stylesheet href=styles/main.css />
        <script type=module src=scripts/hydrate.js defer></script>
        <title>RUMblog</title>
    </head>
    <body>
        <div blocker></div>

        <compute @=lib/indexProvider.js></compute>

        <compute @=scripts/rule.js target=RUMBLE>
            <strong style='color: rgb(182, 155, 107);'><em>RUMBLE</em></strong>
        </compute>

        <compute @=scripts/rule.js target=volatile>

        </compute>
        <compute @=scripts/rule.js target=Volatile>
            <strong style='color: rgb(238, 118, 118);'><em>Volatile</em></strong>
        </compute>
        </>
        <compute @=scripts/rule.js target=flow>
            <em style='color: rgb(78, 200, 200);'>flow</em>
        </compute>
        <compute @=scripts/rule.js target=Flow>
            <strong style='color: rgb(98, 200, 200);'><em>Flow</em></strong>
        </compute>
        </>
        <compute @=scripts/rule.js target=charge>
            <em style='color: rgb(230, 200, 105);'>charge</em>
        </compute>
        <compute @=scripts/rule.js target=Charge>
            <strong style='color: rgb(230, 200, 105);'><em>Charge</em></strong>
        </compute>
        </>
        <compute @=scripts/rule.js target=stubborn>
            <em style='color: rgb(100, 150, 220);'>stubborn</em>
        </compute>
        <compute @=scripts/rule.js target=Stubborn>
            <strong style='color: rgb(100, 150, 220);'><em>Stubborn</em></strong>
        </compute>
        </>
        <compute @=scripts/rule.js target=guard>
            <em style='color: rgb(225, 160, 110);'>guard</em>
        </compute>
        <compute @=scripts/rule.js target=Guard>
            <strong style='color: rgb(225, 160, 110);'><em>Guard</em></strong>
        </compute>
        </>
        <compute @=scripts/rule.js target=adamant>
            <em style='color: rgb(205, 120, 220);'>adamant</em>
        </compute>
        <compute @=scripts/rule.js target=Adamant>
            <strong style='color: rgb(205, 120, 220);'><em>Adamant</em></strong>
        </compute>
        </>
        <compute @=scripts/rule.js target=surge>
            <em style='color: rgb(120, 210, 100);'>surge</em>
        </compute>
        <compute @=scripts/rule.js target=Surge>
            <strong style='color: rgb(120, 210, 100);'><em>Surge</em></strong>
        </compute>
        <compute @=scripts/rule.js target=vigor>
            <em style='color: rgb(190, 205, 120);'>vigor</em>
        </compute>
        <compute @=scripts/rule.js target=Vigor>
            <strong style='color: rgb(190, 205, 120);'><em>Vigor</em></strong>
        </compute>

        <header>
            <page @=pages/nav.htm />
        </header>
        
        <main class=container-fluid>
            <compute @=scripts/init-home.js />
        </main>
        
        <footer>
            <page @=pages/links.htm />
        </footer>
    </body>
</html>
